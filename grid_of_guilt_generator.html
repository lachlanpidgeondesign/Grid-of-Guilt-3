<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid of Guilt Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap');

    :root {
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-background-primary: #fff;
      --color-background-secondary: #f5f5f5;
      --color-border-primary: #ddd;
      --color-border-secondary: #e5e5e5;
      --color-border-tertiary: #efefef;
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --color-text-primary: #f0f0f0;
        --color-text-secondary: #b0b0b0;
        --color-text-tertiary: #888;
        --color-background-primary: #1a1a1a;
        --color-background-secondary: #2a2a2a;
        --color-border-primary: #444;
        --color-border-secondary: #333;
        --color-border-tertiary: #2a2a2a;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    .w {
      font-family: 'DM Sans', sans-serif;
      padding: 1.25rem 1rem;
      max-width: 980px;
      margin: 0 auto
    }

    @media (max-width: 480px) {
      .w {
        padding: 1rem 0.75rem
      }
    }

    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .2rem;
      flex-wrap: wrap;
      gap: 8px
    }

    @media (max-width: 480px) {
      .hdr {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px
      }
    }

    .ttl {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-weight: 600;
      color: var(--color-text-primary)
    }

    @media (max-width: 480px) {
      .ttl {
        font-size: 18px
      }
    }

    .sub {
      font-size: 11px;
      color: var(--color-text-tertiary);
      font-family: 'DM Mono', monospace;
      margin-top: 2px
    }

    @media (max-width: 480px) {
      .sub {
        font-size: 10px;
      }
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap
    }

    @media (max-width: 480px) {
      .controls {
        width: 100%;
        flex-direction: column;
        gap: 8px
      }
    }

    .diffbtn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--color-border-secondary);
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--color-text-secondary);
      transition: all .15s
    }

    @media (max-width: 480px) {
      .diffbtn {
        flex: 1;
        padding: 8px 10px;
        font-size: 13px
      }
    }

    .diffbtn.active {
      border-color: #1a1a1a;
      background: #1a1a1a;
      color: #fff
    }

    .genbtn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--color-border-secondary);
      background: var(--color-background-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--color-text-primary)
    }

    @media (max-width: 480px) {
      .genbtn {
        flex: 1;
        padding: 8px 10px;
        font-size: 13px
      }
    }

    .genbtn:hover {
      background: var(--color-border-tertiary)
    }

    .div {
      height: .5px;
      background: var(--color-border-tertiary);
      margin: .6rem 0 1rem
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 268px;
      gap: 1.25rem;
      align-items: start
    }

    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 1rem
      }
    }

    .col-labels {
      display: grid;
      gap: 3px;
      margin-bottom: 3px
    }

    .cl {
      text-align: center;
      font-size: 10px;
      color: var(--color-text-tertiary);
      font-family: 'DM Mono', monospace
    }

    @media (max-width: 480px) {
      .cl {
        font-size: 9px;
      }
    }

    .grow {
      display: grid;
      gap: 0;
      margin-bottom: 3px;
      width: 100%
    }

    .rl {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--color-text-tertiary);
      font-family: 'DM Mono', monospace
    }

    @media (max-width: 480px) {
      .rl {
        font-size: 9px;
      }
    }

    #grid {
      border: 4px solid #000;
      display: inline-block;
      width: min(100%, 720px);
      max-width: 100%
    }

    @media (max-width: 768px) {
      #grid {
        border: 3px solid #000;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      #grid {
        border: 2px solid #000;
      }
    }

    .cell {
      aspect-ratio: 1;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: filter .1s;
      overflow: hidden;
      box-sizing: border-box
    }

    .cell:hover {
      filter: brightness(.88)
    }

    .cell.starter {
      cursor: default
    }

    .cell.correct {
      border-color: #3B6D11 !important
    }

    .cell.wrong {
      border-color: #E24B4A !important
    }

    .tok {
      width: 58%;
      height: 58%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 500;
      color: #fff;
      font-family: 'DM Mono', monospace;
      cursor: grab;
      flex-shrink: 0;
      position: relative;
      z-index: 2
    }

    .tok:active {
      cursor: grabbing
    }

    .xmark {
      font-size: 32px;
      font-weight: 500;
      line-height: 1;
      user-select: none;
      pointer-events: none;
      position: relative;
      z-index: 2
    }

    .rlabel {
      position: absolute;
      bottom: 2px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 7px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      pointer-events: none;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 1px;
      z-index: 1
    }

    .crime-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none
    }

    .legend {
      display: grid;
      gap: 4px;
      margin-top: .75rem
    }

    @media (max-width: 480px) {
      .legend {
        margin-top: 1rem;
      }
    }

    .lchip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      border-radius: 5px;
      padding: 3px 7px;
      border: 1.5px solid transparent
    }

    .ldot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      flex-shrink: 0
    }

    .scard {
      background: var(--color-background-primary);
      border: .5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-lg);
      padding: .85rem 1rem;
      margin-bottom: .7rem
    }

    @media (max-width: 768px) {
      .scard {
        margin-bottom: 1rem;
      }
    }

    .sch {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin-bottom: .5rem;
      font-family: 'DM Mono', monospace
    }

    .slist {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .srow {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 7px;
      border-radius: 6px;
      border: .5px solid var(--color-border-tertiary);
      background: var(--color-background-secondary);
      transition: all .15s
    }

    .srow.selected {
      border-color: #1a1a1a;
      background: #1a1a1a;
      color: #fff
    }

    .srow.selected .si,
    .srow.selected .st {
      color: #fff
    }

    @media (max-width: 480px) {
      .srow {
        padding: 6px 8px;
      }
    }

    .srow.placed {
      opacity: .32;
      pointer-events: none
    }

    .srow.starter-row {
      border-color: var(--color-border-primary);
      cursor: default;
      opacity: 1
    }

    .si {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 500;
      font-family: 'DM Mono', monospace;
      flex-shrink: 0
    }

    .sn {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-primary);
      flex: 1
    }

    @media (max-width: 480px) {
      .sn {
        font-size: 13px;
      }
    }

    .st {
      font-size: 10px;
      color: var(--color-text-tertiary);
      font-family: 'DM Mono', monospace
    }

    .st.ptag {
      color: #3B6D11;
      background: #EAF3DE;
      padding: 1px 5px;
      border-radius: 3px
    }

    .clist {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .ci {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      padding: 6px 7px;
      border-radius: 6px;
      border: .5px solid var(--color-border-secondary);
      background: var(--color-background-primary)
    }

    @media (max-width: 480px) {
      .ci {
        padding: 7px 8px;
        gap: 8px;
      }
    }

    .ci.mc {
      border-color: #cc3300;
      background: #fff5f2
    }

    .cdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1a1a1a;
      margin-top: 4px;
      flex-shrink: 0
    }

    .ci.mc .cdot {
      background: #cc3300
    }

    .cn {
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-primary);
      display: block;
      margin-bottom: 1px
    }

    .ci.mc .cn {
      color: #993C1D
    }

    .ct {
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.42
    }

    .ci.mc .ct {
      color: #7a2e10
    }

    .ct em {
      font-style: italic;
      color: var(--color-text-primary)
    }

    .ci.mc .ct em {
      color: #993C1D
    }

    .rh {
      font-size: 11px;
      color: var(--color-text-tertiary);
      line-height: 1.5;
      border-top: .5px solid var(--color-border-tertiary);
      padding-top: .5rem;
      margin-top: .5rem
    }

    @media (max-width: 480px) {
      .rh {
        font-size: 10px;
      }
    }

    .btns {
      display: flex;
      gap: 6px;
      margin-top: .6rem
    }

    @media (max-width: 480px) {
      .btns {
        gap: 8px;
        flex-direction: row;
      }

      .btns .chkbtn {
        flex: 2;
      }

      .btns .resetbtn {
        flex: 1;
        padding: 8px;
      }
    }

    .chkbtn {
      flex: 1;
      padding: 7px;
      border-radius: 7px;
      border: 1.5px solid #1a1a1a;
      background: #1a1a1a;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer
    }

    @media (max-width: 480px) {
      .chkbtn {
        padding: 10px 8px;
        font-size: 13px;
      }
    }

    .chkbtn:hover {
      background: #333
    }

    .resetbtn {
      padding: 7px 10px;
      border-radius: 7px;
      border: 1.5px solid var(--color-border-secondary);
      background: transparent;
      color: var(--color-text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      cursor: pointer
    }

    @media (max-width: 480px) {
      .resetbtn {
        padding: 8px 6px;
        font-size: 12px;
      }
    }

    .resetbtn:hover {
      background: var(--color-background-secondary)
    }

    .rbar {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      margin-top: .45rem;
      padding: 5px 8px;
      border-radius: 6px;
      display: none
    }

    .rbar.show {
      display: block
    }

    .rbar.ok {
      background: #EAF3DE;
      color: #3B6D11;
      border: .5px solid #3B6D11
    }

    .rbar.err {
      background: #FCEBEB;
      color: #A32D2D;
      border: .5px solid #E24B4A
    }

    .rbar.part {
      background: #FAEEDA;
      color: #854F0B;
      border: .5px solid #BA7517
    }

    .gen-status {
      font-size: 11px;
      color: var(--color-text-tertiary);
      font-family: 'DM Mono', monospace;
      text-align: center;
      padding: .5rem 0
    }

    @media (max-width: 480px) {
      .gen-status {
        font-size: 10px;
        padding: 0.75rem 0;
      }
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border-secondary);
      border-top-color: var(--color-text-primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-right: 8px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .loading-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 100px;
      font-size: 12px;
      color: var(--color-text-secondary)
    }
  </style>
</head>

<body>

  <div class="w">
    <div class="hdr">
      <div>
        <div class="ttl">Grid of Guilt</div>
        <div class="sub" id="case-sub">generating puzzle...</div>
      </div>
      <div class="controls">
        <button class="diffbtn active" data-d="easy">Easy</button>
        <button class="diffbtn" data-d="medium">Medium</button>
        <button class="diffbtn" data-d="hard">Hard</button>
        <button class="genbtn" id="genbtn">New puzzle</button>
      </div>
    </div>
    <div class="div"></div>
    <div id="gen-status" class="gen-status">
      <div class="loading-hint">
        <div class="spinner"></div><span>Generating puzzle...</span>
      </div>
    </div>
    <div class="layout" id="main-layout" style="display:none">
      <div>
        <div id="col-labels" class="col-labels"></div>
        <div id="grid"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div>
        <div class="scard">
          <div class="sch">Suspects</div>
          <div class="slist" id="slist"></div>
        </div>
        <div class="scard">
          <div class="sch">Evidence &amp; Clues</div>
          <div class="clist" id="clist"></div>
          <div class="rh">No two suspects share a row, column, or room — none may be in adjacent cells.</div>
          <div class="btns">
            <button class="chkbtn" id="chkbtn">Check solution</button>
            <button class="resetbtn" id="resetbtn">Reset</button>
            <button class="resetbtn" id="revealbtn">Reveal</button>
            <button class="resetbtn" id="regenbtn">Regen clues</button>
          </div>
          <div class="rbar" id="rbar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simplified, faster puzzle generator
    const COLS = 'ABCDEFGHI';
    const ROOM_PALETTES = [
      { name: 'Library', fill: '#2E5CB8', dark: '#1A3A7A' },
      { name: 'Ballroom', fill: '#E74C3C', dark: '#A93226' },
      { name: 'Kitchen', fill: '#F39C12', dark: '#B8740F' },
      { name: 'Study', fill: '#9B59B6', dark: '#6C3A6F' },
      { name: 'Wine Cellar', fill: '#1ABC9C', dark: '#117A65' },
      { name: 'Trophy Room', fill: '#3498DB', dark: '#2E86C1' },
      { name: 'Conservatory', fill: '#E67E22', dark: '#BA4A00' },
      { name: 'Billiard Room', fill: '#27AE60', dark: '#1E8449' },
      { name: 'Gallery', fill: '#34495E', dark: '#1F2E3C' },
    ];

    const SUSPECT_NAMES = [
      ['E. Crane', 'L. Morrow', 'R. Holt', 'V. Dusk', 'A. Wren'],
      ['E. Crane', 'L. Morrow', 'R. Holt', 'V. Dusk', 'A. Wren', 'O. Pryce', 'N. Fenn'],
      ['E. Crane', 'L. Morrow', 'R. Holt', 'V. Dusk', 'A. Wren', 'O. Pryce', 'N. Fenn', 'J. Vale', 'C. Moss'],
    ];

    const DIFF_CONFIG = {
      easy: { N: 5, clueTypes: ['edge', 'odd-col', 'even-col', 'odd-row', 'even-row', 'in-room', 'above', 'below'] },
      medium: { N: 7, clueTypes: ['edge', 'odd-col', 'even-col', 'odd-row', 'even-row', 'in-room', 'above', 'below', 'same-half-h', 'same-half-v', 'opp-half-h', 'opp-half-v', 'border-room'] },
      hard: { N: 9, clueTypes: ['edge', 'odd-col', 'even-col', 'odd-row', 'even-row', 'in-room', 'above', 'below', 'same-half-h', 'same-half-v', 'opp-half-h', 'opp-half-v', 'border-room'] },
    };

    let STATE = {};
    let dragging = null;
    let currentDiff = 'easy';

    function rnd(a) { return a[Math.floor(Math.random() * a.length)] }
    function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[b[i], b[j]] = [b[j], b[i]] } return b }

    function generateDoorsAndWindows(map, N) {
      const boundaries = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (c + 1 < N && map[r][c] !== map[r][c + 1]) boundaries.push({ r, c, dir: 'right' });
          if (r + 1 < N && map[r][c] !== map[r + 1][c]) boundaries.push({ r, c, dir: 'down' });
        }
      }
      const outerEdges = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (r === 0) outerEdges.push({ r, c, side: 'top' });
          if (r === N - 1) outerEdges.push({ r, c, side: 'bottom' });
          if (c === 0) outerEdges.push({ r, c, side: 'left' });
          if (c === N - 1) outerEdges.push({ r, c, side: 'right' });
        }
      }
      const numDoors = Math.min(Math.max(3, Math.floor(N * 0.7)), boundaries.length);
      const numWindows = Math.min(Math.max(3, Math.floor(N * 0.7)), outerEdges.length);
      const doors = shuffle(boundaries).slice(0, numDoors);
      const windows = shuffle(outerEdges).slice(0, numWindows);
      const doorCells = new Set();
      for (const d of doors) {
        doorCells.add(`${d.r},${d.c}`);
        if (d.dir === 'right') doorCells.add(`${d.r},${d.c + 1}`);
        if (d.dir === 'down') doorCells.add(`${d.r + 1},${d.c}`);
      }
      const windowCells = new Set();
      for (const w of windows) {
        windowCells.add(`${w.r},${w.c}`);
      }
      return { doors, windows, doorCells, windowCells };
    }

    function createDoorIcon(side) {
      const el = document.createElement('div');
      const pos = side === 'right'
        ? 'right:1px;top:50%;transform:translateY(-50%)'
        : 'bottom:1px;left:50%;transform:translateX(-50%)';
      el.style.cssText = `position:absolute;z-index:3;pointer-events:none;width:26%;opacity:0.85;${pos}`;
      el.innerHTML = `<svg viewBox="0 0 20 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="18" height="24" rx="2" fill="#f0e0cc" stroke="#5a3e28" stroke-width="1.5"/>
        <path d="M3 24 L3 3 L14 4.5 L14 23 Z" fill="#c4956a" stroke="#5a3e28" stroke-width="0.8"/>
        <circle cx="12" cy="14" r="1.2" fill="#d4a843"/>
      </svg>`;
      return el;
    }

    function createWindowIcon(side) {
      const el = document.createElement('div');
      const posMap = {
        top: 'top:1px;left:50%;transform:translateX(-50%)',
        bottom: 'bottom:1px;left:50%;transform:translateX(-50%)',
        left: 'left:1px;top:50%;transform:translateY(-50%)',
        right: 'right:1px;top:50%;transform:translateY(-50%)'
      };
      el.style.cssText = `position:absolute;z-index:3;pointer-events:none;width:26%;opacity:0.85;${posMap[side]}`;
      el.innerHTML = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="18" height="18" rx="1.5" fill="#cce5ff" stroke="#666" stroke-width="1.5"/>
        <line x1="10" y1="1.5" x2="10" y2="18.5" stroke="#666" stroke-width="1"/>
        <line x1="1.5" y1="10" x2="18.5" y2="10" stroke="#666" stroke-width="1"/>
      </svg>`;
      return el;
    }

    function generatePuzzle(diff) {
      return generatePuzzleWithProgress(diff, () => true);
    }

    function generatePuzzleWithProgress(diff, progressCallback) {
      const cfg = DIFF_CONFIG[diff];
      const N = cfg.N;
      const rooms = ROOM_PALETTES.slice(0, N).map((r, i) => ({ ...r }));
      const suspectNames = SUSPECT_NAMES[diff === 'easy' ? 0 : diff === 'medium' ? 1 : 2];
      const suspects = suspectNames.map(name => ({ name, id: name.split(' ').map(p => p[0]).join('').replace('.', '').slice(0, 2).toUpperCase() }));

      // Debug statistics
      let debugStats = {
        totalAttempts: 0,
        backtrackFailures: 0,
        uniquenessFailures: 0,
        avgBacktrackCalls: 0,
        maxBacktrackCalls: 0,
        lastFailureReason: 'Starting...'
      };

      // Generate connected rooms using flood-fill
      function generateConnectedRooms() {
        const map = Array(N).fill(0).map(() => Array(N).fill(-1));
        const roomCounts = Array(N).fill(0);
        const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];

        // Seed rooms at random positions
        const seeds = [];
        while (seeds.length < N) {
          const r = Math.floor(Math.random() * N);
          const c = Math.floor(Math.random() * N);
          if (!seeds.some(s => s[0] === r && s[1] === c) && map[r][c] === -1) {
            map[r][c] = seeds.length;
            roomCounts[seeds.length]++;
            seeds.push([r, c]);
          }
        }

        // Grow rooms to fill grid
        let remaining = N * N - N;
        while (remaining > 0) {
          const cells = [];
          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              if (map[r][c] === -1) {
                for (const [dr, dc] of dirs) {
                  const nr = r + dr, nc = c + dc;
                  if (nr >= 0 && nr < N && nc >= 0 && nc < N && map[nr][nc] !== -1) {
                    cells.push([r, c]);
                    break;
                  }
                }
              }
            }
          }

          if (cells.length === 0) break;

          for (const [r, c] of cells) {
            if (map[r][c] !== -1) continue;

            const neighbors = new Set();
            for (const [dr, dc] of dirs) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < N && nc >= 0 && nc < N && map[nr][nc] !== -1) {
                neighbors.add(map[nr][nc]);
              }
            }

            if (neighbors.size > 0) {
              // Prefer room with fewest cells
              let bestRoom = -1, minCount = Infinity;
              for (const room of neighbors) {
                if (roomCounts[room] < minCount) {
                  minCount = roomCounts[room];
                  bestRoom = room;
                }
              }
              map[r][c] = bestRoom;
              roomCounts[bestRoom]++;
              remaining--;
            }
          }
        }

        // Fill any remaining cells
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (map[r][c] === -1) {
              for (const [dr, dc] of dirs) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < N && nc >= 0 && nc < N && map[nr][nc] !== -1) {
                  map[r][c] = map[nr][nc];
                  break;
                }
              }
            }
          }
        }

        return map;
      }

      const maxTries = N <= 5 ? 500 : N <= 7 ? 300 : 200; // Reduce attempts for larger grids

      for (let attempt = 0; attempt < maxTries; attempt++) {
        debugStats.totalAttempts++;
        
        if (!progressCallback(attempt + 1, maxTries, debugStats)) return null; // Cancelled
        
        const map = generateConnectedRooms();

        // Try to find valid placement
        const solution = [];
        const usedRows = new Set();
        const usedCols = new Set();
        const usedRooms = new Set();

        let backtrackCalls = 0;
        const maxBacktrackCalls = N <= 5 ? 50000 : N <= 7 ? 100000 : 200000; // Scale with grid size
        
        function backtrack() {
          backtrackCalls++;
          if (backtrackCalls > maxBacktrackCalls) return false; // Prevent excessive computation
          
          if (backtrackCalls % 100 === 0) {
            if (!progressCallback(attempt + 1, maxTries, debugStats)) return false; // Cancelled
          }
          
          if (solution.length === N) return true;

          // Try cells in random order for better coverage
          const cells = [];
          for (let r = 0; r < N; r++) {
            if (usedRows.has(r)) continue;
            for (let c = 0; c < N; c++) {
              if (usedCols.has(c)) continue;
              const room = map[r][c];
              if (usedRooms.has(room)) continue;
              let adj = false;
              for (const [pr, pc] of solution) {
                if (Math.abs(r - pr) <= 1 && Math.abs(c - pc) <= 1) { adj = true; break; }
              }
              if (!adj) cells.push([r, c]);
            }
          }

          for (const [r, c] of cells) {
            const room = map[r][c];
            solution.push([r, c]);
            usedRows.add(r);
            usedCols.add(c);
            usedRooms.add(room);
            if (backtrack()) return true;
            solution.pop();
            usedRows.delete(r);
            usedCols.delete(c);
            usedRooms.delete(room);
          }
          return false;
        }

        if (!backtrack()) {
          debugStats.backtrackFailures++;
          debugStats.lastFailureReason = `Backtrack failed after ${backtrackCalls} calls`;
          debugStats.avgBacktrackCalls = (debugStats.avgBacktrackCalls * (debugStats.totalAttempts - 1) + backtrackCalls) / debugStats.totalAttempts;
          debugStats.maxBacktrackCalls = Math.max(debugStats.maxBacktrackCalls, backtrackCalls);
          continue;
        }

        const murdererIdx = Math.floor(Math.random() * N);
        let starterIdx;
        do { starterIdx = Math.floor(Math.random() * N) } while (starterIdx === murdererIdx);

        const [mr, mc] = solution[murdererIdx];
        const murderRoom = map[mr][mc];
        let crimeSceneCell = null;
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (map[r][c] === murderRoom && !(r === mr && c === mc)) { crimeSceneCell = [r, c]; break; }
          }
          if (crimeSceneCell) break;
        }

        const { doors, windows, doorCells, windowCells } = generateDoorsAndWindows(map, N);

        // Generate multiple clue sets and find one that gives unique solution
        let validPuzzle = null;
        const maxClueAttempts = 10; // Try different clue combinations
        
        for (let clueAttempt = 0; clueAttempt < maxClueAttempts && !validPuzzle; clueAttempt++) {
          const usedTypes = new Set();
          const clues = solution.map((pos, si) => {
            const [r, c] = pos;
            const room = map[r][c];
            const clueOptions = [];

            // Avoid murderer having an explicit room clue (keep murder status unseen until reveal)
            if (si !== murdererIdx) {
              clueOptions.push({
                type: 'room',
                text: `Was confirmed in the <em>${rooms[room].name}</em> all evening.`,
                check: (tr, tc) => map[tr][tc] === room
              });
            }

            if (!usedTypes.has('row-parity')) {
              clueOptions.push({
                type: 'row-parity',
                text: r % 2 === 0 ? `Witnesses placed them in an <em>odd-numbered row</em>.` : `Witnesses placed them in an <em>even-numbered row</em>.`,
                check: (tr, tc) => tr % 2 === (r % 2)
              });
            }

            if (!usedTypes.has('col-parity')) {
              clueOptions.push({
                type: 'col-parity',
                text: c % 2 === 0 ? `They were spotted in an <em>odd-numbered column</em>.` : `They were spotted in an <em>even-numbered column</em>.`,
                check: (tr, tc) => tc % 2 === (c % 2)
              });
            }

            if ((r === 0 || r === N - 1 || c === 0 || c === N - 1) && !usedTypes.has('edge')) {
              clueOptions.push({
                type: 'edge',
                text: `Was seen near the <em>outer walls</em> of the manor.`,
                check: (tr, tc) => tr === 0 || tr === N - 1 || tc === 0 || tc === N - 1
              });
            }

            if ((r === 0 || r === N - 1) && (c === 0 || c === N - 1) && !usedTypes.has('corner')) {
              clueOptions.push({
                type: 'corner',
                text: `Was spotted in <em>a corner</em> of the manor.`,
                check: (tr, tc) => (tr === 0 || tr === N - 1) && (tc === 0 || tc === N - 1)
              });
            }

            if (!usedTypes.has('near-door')) {
              const isNearDoor = doorCells.has(`${r},${c}`);
              clueOptions.push({
                type: 'near-door',
                text: isNearDoor
                  ? `Was seen lingering near a <em>doorway</em>.`
                  : `Was <em>far from any doorways</em>.`,
                check: (tr, tc) => isNearDoor === doorCells.has(`${tr},${tc}`)
              });
            }

            if (!usedTypes.has('near-window')) {
              const isNearWindow = windowCells.has(`${r},${c}`);
              clueOptions.push({
                type: 'near-window',
                text: isNearWindow
                  ? `Was spotted near a <em>window</em>.`
                  : `Was <em>nowhere near any windows</em>.`,
                check: (tr, tc) => isNearWindow === windowCells.has(`${tr},${tc}`)
              });
            }

            // If no options available, fall back to room clue (but not for murderer)
            if (clueOptions.length === 0 && si !== murdererIdx) {
              clueOptions.push({
                type: 'room-fallback',
                text: `Was confirmed in the <em>${rooms[room].name}</em> all evening.`,
                check: (tr, tc) => map[tr][tc] === room
              });
            }

            if (clueOptions.length > 0) {
              const clue = clueOptions[Math.floor(Math.random() * clueOptions.length)];
              usedTypes.add(clue.type);
              return clue;
            } else {
              // Emergency fallback - this shouldn't happen often
              return {
                type: 'emergency',
                text: `Has an unknown alibi.`,
                check: () => true // Always true, doesn't help solve
              };
            }
          });

          const orderedIdxs = Array.from({ length: N }, (_, i) => i).sort((a, b) => (a === murdererIdx ? 1 : b === murdererIdx ? -1 : 0));

          const candidate = {
            N, map, rooms, suspects, sol: solution, murdererIdx, starterIdx, crimeSceneCell, clues, orderedIdxs,
            doors, windows, doorCells, windowCells
          };

          const solutionCount = countValidPuzzleSolutions(candidate, 2);
          const isValid = N >= 7 ? (solutionCount >= 1) : (solutionCount === 1);
          
          if (isValid) {
            validPuzzle = candidate;
            break;
          } else {
            debugStats.uniquenessFailures++;
            debugStats.lastFailureReason = `Clue attempt ${clueAttempt + 1}: ${solutionCount} solutions found${N >= 7 ? ' (need ≥1 for large grids)' : ' (need exactly 1)'}`;
          }
        }
        
        if (validPuzzle) {
          return validPuzzle;
        }
      }

      return null;
    }

    function countValidPuzzleSolutions(P, maxCount = 2) {
      const { N, map, clues, starterIdx, sol } = P;
      
      // For larger grids, reduce the thoroughness to prevent crashes
      if (N >= 7) {
        maxCount = 1; // Just check if there's at least one solution
        // We'll assume uniqueness based on the constraints being strict enough
      }
      
      const placed = Array.from({ length: N }, () => Array(N).fill(false));
      const usedRows = new Set();
      const usedCols = new Set();
      const usedRooms = new Set();

      const [sr, sc] = sol[starterIdx];
      placed[sr][sc] = true;
      usedRows.add(sr); usedCols.add(sc); usedRooms.add(map[sr][sc]);
      if (!clues[starterIdx].check(sr, sc)) return 0;

      let count = 0;
      let backtrackCalls = 0;
      const maxBacktrackCalls = N <= 5 ? 10000 : N <= 7 ? 50000 : 100000; // Limit based on grid size
      const order = Array.from({ length: N }, (_, i) => i).filter(i => i !== starterIdx);

      const canPlace = (r, c) => {
        if (placed[r][c]) return false;
        if (usedRows.has(r) || usedCols.has(c) || usedRooms.has(map[r][c])) return false;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const rr = r + dr, cc = c + dc;
            if (rr >= 0 && rr < N && cc >= 0 && cc < N && placed[rr][cc]) return false;
          }
        }
        return true;
      };

      function backtrack(idx) {
        backtrackCalls++;
        if (backtrackCalls > maxBacktrackCalls) return; // Prevent infinite loops
        if (count >= maxCount) return;
        if (idx >= order.length) {
          count++;
          return;
        }
        const si = order[idx];
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (!canPlace(r, c)) continue;
            if (!clues[si].check(r, c)) continue;

            placed[r][c] = true;
            usedRows.add(r); usedCols.add(c); usedRooms.add(map[r][c]);

            backtrack(idx + 1);

            placed[r][c] = false;
            usedRows.delete(r); usedCols.delete(c); usedRooms.delete(map[r][c]);
            if (count >= maxCount) return;
          }
        }
      }

      backtrack(0);
      return count;
    }


    let P = null;
    let cellState = {};
    let selectedSuspect = null;

    function isPlaced(i) { return Object.values(cellState).includes(i) }

    function renderAll() { renderGrid(); renderSuspects() }

    function renderGrid() {
      const { N, map, rooms, sol, starterIdx, crimeSceneCell, murdererIdx } = P;

      // Build door/window lookup by cell
      const doorLookup = {};
      if (P.doors) {
        for (const d of P.doors) {
          const key = `${d.r},${d.c}`;
          if (!doorLookup[key]) doorLookup[key] = [];
          doorLookup[key].push(d.dir === 'right' ? 'right' : 'bottom');
        }
      }
      const windowLookup = {};
      if (P.windows) {
        for (const w of P.windows) {
          const key = `${w.r},${w.c}`;
          if (!windowLookup[key]) windowLookup[key] = [];
          windowLookup[key].push(w.side);
        }
      }

      const colLabels = document.getElementById('col-labels');
      colLabels.style.gridTemplateColumns = `18px repeat(${N},1fr)`;
      colLabels.innerHTML = '<div></div>' + Array.from({ length: N }, (_, i) => `<div class="cl">${COLS[i]}</div>`).join('');

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < N; r++) {
        const row = document.createElement('div');
        row.className = 'grow';
        row.style.gridTemplateColumns = `18px repeat(${N},1fr)`;
        const rl = document.createElement('div'); rl.className = 'rl'; rl.textContent = r + 1; row.appendChild(rl);
        for (let c = 0; c < N; c++) {
          const key = `${r},${c}`;
          const isStarter = r === sol[starterIdx][0] && c === sol[starterIdx][1];
          const rm = rooms[map[r][c]];
          const val = cellState[key];
          const cell = document.createElement('div');
          cell.className = 'cell' + (isStarter ? ' starter' : '');
          cell.style.background = rm.fill + '20';

          // Set interior lines once (top/left). Use thicker lines for room boundaries.
          const normalBorder = '2px solid #ccc';
          const strongBorder = '4px solid #333';
          if (r === 0) {
            cell.style.borderTop = normalBorder;
          } else {
            cell.style.borderTop = map[r][c] !== map[r - 1][c] ? strongBorder : normalBorder;
          }
          if (c === 0) {
            cell.style.borderLeft = normalBorder;
          } else {
            cell.style.borderLeft = map[r][c] !== map[r][c - 1] ? strongBorder : normalBorder;
          }
          if (r === N - 1) {
            cell.style.borderBottom = normalBorder;
          }
          if (c === N - 1) {
            cell.style.borderRight = normalBorder;
          }

          const isCrime = crimeSceneCell && crimeSceneCell[0] === r && crimeSceneCell[1] === c;
          if (isCrime) {
            const cs = document.createElement('div');
            cs.className = 'crime-scene';
            cs.innerHTML = `<svg width="60%" height="60%" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="opacity:.55">
          <ellipse cx="20" cy="8" rx="5" ry="5.5" fill="${rm.dark}"/>
          <path d="M10 38 Q10 22 20 20 Q30 22 30 38" fill="${rm.dark}"/>
          <path d="M10 28 Q6 24 5 20" stroke="${rm.dark}" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M30 28 Q34 24 35 20" stroke="${rm.dark}" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M13 38 Q11 32 10 28" stroke="${rm.dark}" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M27 38 Q29 32 30 28" stroke="${rm.dark}" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>`;
            cell.appendChild(cs);
          }

          const roomLbl = document.createElement('div');
          roomLbl.className = 'rlabel';
          roomLbl.style.color = rm.dark + '99';
          roomLbl.textContent = rm.name;
          cell.appendChild(roomLbl);

          // Render doors and windows on this cell
          const cellKey = `${r},${c}`;
          if (doorLookup[cellKey]) {
            for (const dir of doorLookup[cellKey]) cell.appendChild(createDoorIcon(dir));
          }
          if (windowLookup[cellKey]) {
            for (const side of windowLookup[cellKey]) cell.appendChild(createWindowIcon(side));
          }

          if (typeof val === 'number') {
            const tok = document.createElement('div');
            tok.className = 'tok';
            tok.textContent = P.suspects[val].id;
            tok.style.background = isStarter ? '#1a1a1a' : rm.fill;
            if (!isStarter) {
              tok.style.cursor = 'pointer';
              tok.addEventListener('click', e => { e.stopPropagation(); delete cellState[key]; clearResult(); renderAll() });
            }
            cell.appendChild(tok);
          } else if (val === 'x') {
            const x = document.createElement('div'); x.className = 'xmark';
            x.style.color = rm.dark + '55'; x.textContent = '×'; cell.appendChild(x);
          }

          if (!isStarter) {
            cell.style.cursor = 'pointer';
            cell.addEventListener('click', () => {
              if (!selectedSuspect && selectedSuspect !== 0) {
                // No suspect selected - toggle marking
                if (typeof cellState[key] === 'number') { delete cellState[key]; }
                else if (cellState[key] === 'x') { delete cellState[key]; }
                else { cellState[key] = 'x'; }
              } else {
                // Suspect selected - place or swap
                const si = selectedSuspect;
                const existing = cellState[key];
                const oldKey = Object.entries(cellState).find(([k, v]) => v === si)?.[0];
                if (oldKey) delete cellState[oldKey];
                if (typeof existing === 'number' && existing !== si) cellState[key] = existing;
                cellState[key] = si;
              }
              clearResult(); renderAll();
            });
          }
          row.appendChild(cell);
        }
        grid.appendChild(row);
      }
    }

    function renderSuspects() {
      const list = document.getElementById('slist'); list.innerHTML = '';
      P.suspects.forEach((s, i) => {
        const placed = isPlaced(i);
        const isStarter = i === P.starterIdx;
        const isSelected = selectedSuspect === i;
        const row = document.createElement('div');
        row.className = 'srow' + (placed ? ' placed' : '') + (isStarter ? ' starter-row' : '') + (isSelected ? ' selected' : '');
        if (!placed && !isStarter) {
          row.style.cursor = 'pointer';
          row.addEventListener('click', () => {
            selectedSuspect = isSelected ? null : i;
            renderSuspects();
          });
        }
        row.innerHTML = `<div class="si">${s.id}</div><div class="sn">${s.name}</div><div class="st ${placed ? 'ptag' : ''}">${isStarter ? 'given' : placed ? 'placed' : isSelected ? 'click cell' : 'click to place'}</div>`;
        list.appendChild(row);
      });
    }

    function renderClues() {
      const list = document.getElementById('clist'); list.innerHTML = '';
      P.orderedIdxs.forEach((si, order) => {
        if (si === P.starterIdx) return;
        const cl = P.clues[si];
        const s = P.suspects[si];
        const el = document.createElement('div');
        el.className = 'ci';
        const orderLabel = order === 0 ? 'given' : `clue ${order}`;

        list.appendChild(el);

      });

      leg.appendChild(doorChip);

      leg.appendChild(winChip);
    }

    function checkSolution() {
      const bar = document.getElementById('rbar');
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('wrong', 'correct'));
      const placed = Object.entries(cellState).filter(([k, v]) => typeof v === 'number');
      if (placed.length < P.N) {
        bar.className = 'rbar show part';
        bar.textContent = `${P.N - placed.length} suspect${P.N - placed.length > 1 ? 's' : ''} still unplaced.`; return;
      }
      let allOk = true;
      placed.forEach(([key, si]) => {
        const [r, c] = key.split(',').map(Number);
        const [sr, sc] = P.sol[si];
        const isStarter = r === P.sol[P.starterIdx][0] && c === P.sol[P.starterIdx][1];
        if (isStarter) return;
        const rowEl = document.getElementById('grid').children[r];
        const cellEl = rowEl ? rowEl.children[c + 1] : null;
        if (cellEl) { if (r === sr && c === sc) cellEl.classList.add('correct'); else { cellEl.classList.add('wrong'); allOk = false; } }
      });
      if (allOk) {
        bar.className = 'rbar show ok';
        bar.textContent = 'Correct! All suspects are correctly placed (murderer will be revealed with Reveal).';
      } else {
        bar.className = 'rbar show err'; bar.textContent = 'Some placements are wrong — shown in red.';
      }
    }

    function clearResult() {
      document.getElementById('rbar').className = 'rbar';
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('wrong', 'correct'));
    }

    function generateCluesForPuzzle(P) {
      const { N, map, rooms, sol, murdererIdx } = P;
      const maxClueAttempts = 20;
      
      for (let clueAttempt = 0; clueAttempt < maxClueAttempts; clueAttempt++) {
        const usedTypes = new Set();
        const clues = sol.map((pos, si) => {
          const [r, c] = pos;
          const room = map[r][c];
          const clueOptions = [];

          if (si !== murdererIdx) {
            clueOptions.push({
              type: 'room',
              text: `Was confirmed in the <em>${rooms[room].name}</em> all evening.`,
              check: (tr, tc) => map[tr][tc] === room
            });
          }

          if (!usedTypes.has('row-parity')) {
            clueOptions.push({
              type: 'row-parity',
              text: r % 2 === 0 ? `Witnesses placed them in an <em>odd-numbered row</em>.` : `Witnesses placed them in an <em>even-numbered row</em>.`,
              check: (tr, tc) => tr % 2 === (r % 2)
            });
          }

          if (!usedTypes.has('col-parity')) {
            clueOptions.push({
              type: 'col-parity',
              text: c % 2 === 0 ? `They were spotted in an <em>odd-numbered column</em>.` : `They were spotted in an <em>even-numbered column</em>.`,
              check: (tr, tc) => tc % 2 === (c % 2)
            });
          }

          if ((r === 0 || r === N - 1 || c === 0 || c === N - 1) && !usedTypes.has('edge')) {
            clueOptions.push({
              type: 'edge',
              text: `Was seen near the <em>outer walls</em> of the manor.`,
              check: (tr, tc) => tr === 0 || tr === N - 1 || tc === 0 || tc === N - 1
            });
          }

          if ((r === 0 || r === N - 1) && (c === 0 || c === N - 1) && !usedTypes.has('corner')) {
            clueOptions.push({
              type: 'corner',
              text: `Was spotted in <em>a corner</em> of the manor.`,
              check: (tr, tc) => (tr === 0 || tr === N - 1) && (tc === 0 || tc === N - 1)
            });
          }

          if (!usedTypes.has('near-door') && P.doorCells) {
            const isNearDoor = P.doorCells.has(`${r},${c}`);
            clueOptions.push({
              type: 'near-door',
              text: isNearDoor
                ? `Was seen lingering near a <em>doorway</em>.`
                : `Was <em>far from any doorways</em>.`,
              check: (tr, tc) => isNearDoor === P.doorCells.has(`${tr},${tc}`)
            });
          }

          if (!usedTypes.has('near-window') && P.windowCells) {
            const isNearWindow = P.windowCells.has(`${r},${c}`);
            clueOptions.push({
              type: 'near-window',
              text: isNearWindow
                ? `Was spotted near a <em>window</em>.`
                : `Was <em>nowhere near any windows</em>.`,
              check: (tr, tc) => isNearWindow === P.windowCells.has(`${tr},${tc}`)
            });
          }

          if (clueOptions.length === 0 && si !== murdererIdx) {
            clueOptions.push({
              type: 'room-fallback',
              text: `Was confirmed in the <em>${rooms[room].name}</em> all evening.`,
              check: (tr, tc) => map[tr][tc] === room
            });
          }

          if (clueOptions.length > 0) {
            const clue = clueOptions[Math.floor(Math.random() * clueOptions.length)];
            usedTypes.add(clue.type);
            return clue;
          } else {
            return {
              type: 'emergency',
              text: `Has an unknown alibi.`,
              check: () => true
            };
          }
        });

        const solutionCount = countValidPuzzleSolutions(P, 2);
        const isValid = N >= 7 ? (solutionCount >= 1) : (solutionCount === 1);
        
        if (isValid) {
          P.clues = clues;
          return true;
        }
      }
      
      return false;
    }

    function regenerateClues() {
      if (!P) return;
      generateCluesForPuzzle(P);
      clearResult();
      renderClues();
    }

    function revealSolution() {
      P.sol.forEach((pos, si) => {
        const [r, c] = pos;
        const key = `${r},${c}`;
        if (!cellState.hasOwnProperty(key)) cellState[key] = si;
      });
      renderAll();
      const murdererName = P.suspects[P.murdererIdx].name;
      const bar = document.getElementById('rbar');
      bar.className = 'rbar show ok';
      bar.textContent = `Solution revealed. The murderer is ${murdererName}.`;
    }


    function resetBoard() {
      for (const k of Object.keys(cellState)) {
        const [r, c] = k.split(',').map(Number);
        if (r === P.sol[P.starterIdx][0] && c === P.sol[P.starterIdx][1]) continue;
        delete cellState[k];
      }
      clearResult(); renderAll();
    }

    async function loadPuzzle(diff) {
      const status = document.getElementById('gen-status');
      const layout = document.getElementById('main-layout');
      let isCancelled = false;
      
      status.innerHTML = `
        <div class="loading-hint">
          <div class="spinner"></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <span id="gen-progress">Generating puzzle... (0/20 attempts)</span>
            <button id="cancel-gen" class="genbtn" style="font-size: 10px; padding: 3px 8px;">Cancel</button>
          </div>
        </div>
      `;
      status.style.display = 'block';
      layout.style.display = 'none';

      const cancelBtn = document.getElementById('cancel-gen');
      cancelBtn.addEventListener('click', () => {
        isCancelled = true;
        status.innerHTML = '<div style="color:#666">Generation cancelled. Click "New puzzle" to try again.</div>';
      });

      // Process attempts one by one with UI updates
      const maxAttempts = diff === 'easy' ? 20 : diff === 'medium' ? 15 : 10; // Fewer attempts for harder puzzles
      for (let i = 0; i < maxAttempts && !isCancelled; i++) {
        const progressEl = document.getElementById('gen-progress');
        if (progressEl) {
          progressEl.textContent = `Generating puzzle... (${i + 1}/${maxAttempts} attempts)`;
        }
        
        // Yield control to allow UI update
        await new Promise(resolve => setTimeout(resolve, 10));
        
        if (isCancelled) break;
        
        const p = generatePuzzleWithProgress(diff, (attempt, maxTries, debugStats) => {
          if (isCancelled) return false;
          // Update progress immediately for the current attempt
          const progressEl = document.getElementById('gen-progress');
          if (progressEl) {
            if (debugStats) {
              const failRate = debugStats.totalAttempts > 0 ? 
                ((debugStats.backtrackFailures + debugStats.uniquenessFailures) / debugStats.totalAttempts * 100).toFixed(1) : 0;
              progressEl.innerHTML = `
                Generating puzzle... (${i + 1}/${maxAttempts} attempts, ${attempt}/${maxTries} tries)<br>
                <small style="font-size: 10px; color: #888;">
                  Backtrack fails: ${debugStats.backtrackFailures} | Uniqueness fails: ${debugStats.uniquenessFailures} | Fail rate: ${failRate}%<br>
                  Avg backtracks: ${debugStats.avgBacktrackCalls.toFixed(0)} | Max: ${debugStats.maxBacktrackCalls}<br>
                  ${debugStats.lastFailureReason}
                </small>
              `;
            } else {
              progressEl.textContent = `Generating puzzle... (${i + 1}/${maxAttempts} attempts, ${attempt}/${maxTries} tries)`;
            }
          }
          return true;
        });
        
        if (p) {
          if (isCancelled) return;
          
          P = p;
          cellState = {};
          cellState[`${P.sol[P.starterIdx][0]},${P.sol[P.starterIdx][1]}`] = P.starterIdx;
          const caseNums = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
          document.getElementById('case-sub').textContent = `case no. ${caseNums[Math.floor(Math.random() * caseNums.length)]} — ${diff} difficulty · ${P.N}×${P.N}`;
          status.style.display = 'none';
          layout.style.display = 'grid';
          renderLegend(); renderAll(); renderClues(); clearResult();
          return;
        }
      }

      if (!isCancelled) {
        status.innerHTML = '<div style="color:#E24B4A">Could not generate puzzle. Try Easy.</div>';
      }
    }

    document.querySelectorAll('.diffbtn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diffbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDiff = btn.dataset.d;
        loadPuzzle(currentDiff);
      });
    });
    document.getElementById('genbtn').addEventListener('click', () => loadPuzzle(currentDiff));
    document.getElementById('chkbtn').addEventListener('click', checkSolution);
    document.getElementById('resetbtn').addEventListener('click', resetBoard);
    document.getElementById('revealbtn').addEventListener('click', revealSolution);
    document.getElementById('regenbtn').addEventListener('click', regenerateClues);

    // Global touch handlers for better mobile support
    loadPuzzle('easy');
  </script>
</body>

</html>
